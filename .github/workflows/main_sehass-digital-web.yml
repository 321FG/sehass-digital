name: Deploy Next.js to Azure App Service (sehass-digital-web)

"on":
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-appservice
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'
  AZURE_WEBAPP_NAME: sehass-digital-web

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (Next.js production)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Prune to production dependencies
        run: npm prune --omit=dev

      - name: Package deployment artifact
        run: |
          zip -r deploy.zip \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.ts \
            node_modules \
            -x '.next/cache/*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: deploy.zip
          retention-days: 3

  deploy:
    name: Deploy to Azure App Service
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
